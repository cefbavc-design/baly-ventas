<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baly · Seguimiento de ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Paleta Baly (guía de marca): Amarelo #FFCD00 · Preto #000000 · Branco #FFFFFF */
  :root{
    --yellow:#FFCD00; --black:#000000; --white:#FFFFFF;
    --bg:#f5f5f3; --panel:#ffffff; --ink:#000000; --muted:#5f5f5f; --line:#e4e4e0;
    --s1:#FEDA66; --s2:#FFCD00; --s3:#585a65; --s4:#000000;
    --wpp:#25d366; --crm:#000000; --danger:#c10b20;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--yellow);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:48px;width:auto;display:block}
  .brand span{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.5px;border-left:2px solid var(--black);padding-left:14px;line-height:1.1}
  header input,header select{border-color:transparent}
  header button{border-color:var(--black);background:var(--yellow)}
  header button:hover{background:#ffe066}
  header .primary{background:var(--black);color:var(--yellow)}
  header .primary:hover{background:#222}
  header .mode{background:rgba(0,0,0,.08);color:var(--black)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--black);outline-offset:0;border-color:var(--black)}
  .tools input{width:200px}.tools select{width:auto}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:500}
  button:hover{background:#f0f2f6}
  .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .primary:hover{background:#000}
  .danger{color:var(--danger);border-color:#f3c4c4}
  .mode{font-size:12px;color:var(--muted);padding:4px 8px;border-radius:99px;background:#eef0f4}

  .board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:14px;padding:16px;overflow-x:auto;min-height:calc(100vh - 66px)}
  .col{background:#ebeae5;border-radius:var(--radius);display:flex;flex-direction:column;min-height:300px}
  .col.drag-over{outline:2px dashed var(--muted)}
  .col-head{padding:12px 12px 8px;border-top:4px solid var(--c);border-radius:var(--radius) var(--radius) 0 0;background:var(--panel)}
  .col-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.3px}
  .count{background:var(--c);color:var(--ct);font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px}
  .col-sub{color:var(--muted);font-size:12px;margin-top:4px;min-height:16px}
  .col-sum{display:flex;gap:8px;margin-top:8px}
  .stat{flex:1;background:#f6f6f3;border-radius:8px;padding:6px 8px;line-height:1.15}
  .stat small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .stat b{font-size:15px;font-weight:800;white-space:nowrap}
  .cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .empty img{height:56px;opacity:.35;filter:grayscale(1);transform:rotate(-8deg)}
  .board.vertical .empty{flex-direction:row;justify-content:center}
  .board.vertical .empty img{height:32px}

  .card{background:var(--panel);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;border-left:3px solid var(--c)}
  .card{transition:transform .15s ease, box-shadow .15s ease}
  .card:hover{box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
  .card.dragging{opacity:.4}
  .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .name{font-weight:700;font-size:15px;line-height:1.25}
  .tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;color:#fff;white-space:nowrap}
  .tag.WPP{background:var(--wpp)}.tag.CRM{background:var(--crm)}
  .meta{color:var(--muted);font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .meta b{color:var(--ink);font-weight:600}
  .last-note{margin-top:8px;font-size:12px;color:#454c5c;background:#f6f7f9;border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .card-actions button{padding:4px 8px;font-size:12px}
  .wa{color:#128c4b;text-decoration:none;font-size:12px;font-weight:600}
  .wa.crm{color:var(--black);text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:3px}
  .age{font-size:11px;color:var(--muted)}

  dialog{border:none;border-radius:14px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,24,33,.45)}
  .dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dlg-head{background:var(--yellow)}
  .dlg-head h2{margin:0;font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
  .dlg-head button{background:transparent;border-color:transparent}
  .dlg-body{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:70vh;overflow:auto}
  .full{grid-column:1/-1}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .seg{display:flex;gap:6px}
  .seg label{flex:1;margin:0;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;cursor:pointer;color:var(--ink);font-size:14px}
  .seg input{display:none}
  .seg input:checked+span{font-weight:700}
  .seg label:has(input:checked){border-color:var(--ink);background:#f3f4f7}
  .notes{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .note{background:#f6f7f9;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;position:relative}
  .note small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
  .note .x{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--muted);padding:2px 4px;font-size:13px}
  .add-note{display:flex;gap:6px;margin-top:8px}
  .add-note textarea{min-height:40px;resize:vertical}
  .dlg-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .err{color:var(--danger);font-size:12px;grid-column:1/-1;min-height:14px}

  /* Archivos */
  .files{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .file{display:flex;align-items:center;gap:8px;background:#f6f6f3;border-radius:8px;padding:6px 8px;font-size:13px}
  .file a{color:var(--ink);font-weight:600;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .file a:hover{text-decoration:underline}
  .file small{color:var(--muted);white-space:nowrap}
  .file .x{border:none;background:none;color:var(--muted);padding:2px 4px}
  .drop{margin-top:8px;border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--black);color:var(--ink);background:#fffbe6}
  .drop b{color:var(--ink)}
  .uploading{font-size:12px;color:var(--muted)}

  /* Selector de vista */
  .views{display:flex;border:1px solid var(--black);border-radius:8px;overflow:hidden}
  .views button{border:none;border-radius:0;padding:8px 10px}
  .views button.on{background:var(--black);color:var(--yellow)}
  .who{font-size:12px;font-weight:600;color:var(--ink);background:#eef0f4;border-radius:6px;padding:2px 6px}

  /* Vista vertical: etapas apiladas, ventas en filas */
  .board.vertical{grid-template-columns:1fr;max-width:1100px;margin:0 auto;min-height:auto}
  .board.vertical .col{min-height:0}
  .board.vertical .col-head{display:flex;align-items:baseline;gap:16px;border-top:none;border-left:5px solid var(--c);border-radius:var(--radius) var(--radius) 0 0}
  .board.vertical .col-title{gap:10px}
  .board.vertical .col-sub{display:none}
  .board.vertical .col-sum{margin:0 0 0 auto;min-width:300px}
  .board.vertical .col-head{align-items:center}
  .board.vertical .col-title{min-height:0}
  .col-title{min-height:34px}
  .board.vertical .cards{gap:6px}
  .board.vertical .empty{padding:10px}
  .board.vertical .card{display:grid;grid-template-columns:minmax(160px,1.4fr) 2fr auto;gap:6px 16px;align-items:center;padding:8px 12px}
  .board.vertical .meta{margin:0}
  .board.vertical .last-note{grid-column:1/-1;margin:0;-webkit-line-clamp:1}
  .board.vertical .card-actions{margin:0;gap:12px;justify-content:flex-end}
  .board.vertical .last-note{order:4}

  /* Hero con latas */
  .hero{position:relative;background:var(--black);color:var(--white);overflow:hidden;isolation:isolate}
  .hero::before{content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(ellipse 420px 260px at 82% 115%, rgba(244,149,0,.55), transparent 70%),
               radial-gradient(ellipse 300px 200px at 70% 120%, rgba(235,98,9,.45), transparent 70%),
               repeating-linear-gradient(135deg, rgba(255,205,0,.05) 0 2px, transparent 2px 22px)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,#FFCD00,#fbba00,#f49500,#eb6209,#e15611)}
  .hero-in{max-width:1400px;margin:0 auto;padding:22px 16px 26px;display:flex;gap:24px;align-items:center;min-height:190px}
  .hero-txt{flex:1;min-width:0;padding-right:min(36vw,400px)}
  .kicker{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--yellow)}
  .hero h1{margin:6px 0 4px;font-size:clamp(24px,3.4vw,40px);font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:-.5px}
  .hero h1 em{font-style:normal;color:var(--yellow)}
  .hero-sub{color:#bdbdbd;font-size:13px;font-weight:500}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,205,0,.25);border-radius:12px;padding:8px 14px;min-width:120px}
  .kpi small{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a9a9a9}
  .kpi b{font-size:20px;font-weight:900;color:var(--white);white-space:nowrap}
  .kpi.hot{background:var(--yellow);border-color:var(--yellow)}
  .kpi.hot small{color:rgba(0,0,0,.6)} .kpi.hot b{color:var(--black)}
  .cans{position:absolute;right:max(48px,calc((100vw - 1400px)/2 + 48px));bottom:-10px;height:200px;width:320px;pointer-events:none}
  .cans img{position:absolute;bottom:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
  .cans .c1{height:128px;left:0;transform:rotate(-14deg);transform-origin:bottom center;animation:bob 4.5s ease-in-out infinite}
  .cans .bt{height:196px;left:104px;z-index:1}
  .cans .c2{height:150px;right:0;transform:rotate(11deg);transform-origin:bottom center;animation:bob 4.5s ease-in-out -2.2s infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
  @media (prefers-reduced-motion:reduce){.cans img{animation:none}}
  @media (max-width:900px){
    .hero-txt{padding-right:0}
    .cans{opacity:.28;right:-30px;width:300px}
  }

  @media (max-width:700px){
    .board{grid-template-columns:repeat(4,85vw);scroll-snap-type:x mandatory}
    .col{scroll-snap-align:start}
    .tools{margin-left:0;width:100%}.tools input{flex:1;width:auto}
    .dlg-body{grid-template-columns:1fr}
    .board.vertical .card{grid-template-columns:1fr}
    .board.vertical .col-head{flex-wrap:wrap}
    .board.vertical .col-sum{min-width:0;width:100%;margin:6px 0 0}
    .hero-in{min-height:0;padding:18px 16px 22px}
    .kpi{flex:1 1 40%;min-width:0}
    .board.vertical .card-actions{justify-content:space-between}
  }
</style>
</head>

<main class="board" id="board"></main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dlg-head"><h2 id="dlgTitle">Nueva venta</h2><button type="button" id="btnClose">✕</button></div>
    <div class="dlg-body">
      <div class="full"><label>Cliente</label><input name="cliente" autocomplete="off"></div>
      <div><label>Teléfono</label><input name="telefono" type="tel" placeholder="11 2345 6789"></div>
      <div><label>Pallets</label><input name="pallets" type="text" inputmode="decimal" placeholder="Ej: 1,5" autocomplete="off"></div>
      <div><label>Ciudad</label><input name="ciudad"></div>
      <div><label>Origen</label>
        <div class="seg">
          <label><input type="radio" name="origen" value="WPP"><span>WPP</span></label>
          <label><input type="radio" name="origen" value="CRM"><span>CRM</span></label>
        </div>
      </div>
      <div><label>Lo lleva</label><select name="lleva" id="selLleva"></select></div>
      <div><label>Etapa</label><select name="etapa" id="selEtapa"></select></div>
      <div class="full"><label>Cotización ($)</label><input name="cotizacion" type="text" inputmode="decimal" placeholder="Ej: 1.250.000" autocomplete="off"></div>
      <div class="full">
        <label>Archivos</label>
        <div class="files" id="filesList"></div>
        <div class="drop" id="drop">Arrastrá archivos acá o <b>hacé clic para elegir</b><br><small>Cotizaciones, fotos, PDFs, planillas…</small></div>
        <input type="file" id="fileInput" multiple hidden>
        <div class="uploading" id="uploading"></div>
      </div>
      <div class="full">
        <label>Notas</label>
        <div class="notes" id="notesList"></div>
        <div class="add-note">
          <textarea id="noteText" placeholder="Agregar nota… (Ctrl+Enter)"></textarea>
          <button type="button" id="btnAddNote">Agregar</button>
        </div>
      </div>
      <div class="err" id="err"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="danger" id="btnDelete">Eliminar</button>

        <button type="button" id="btnCancel">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </div>
  </form>
</dialog>

<script>
/* ===== Config de etapas ===== */
const ETAPAS = [
  { id:1, nombre:'Posreunión · Cotizar',             resp:'Cotizar al cliente',           color:'var(--s1)', ct:'#000' },
  { id:2, nombre:'Cotizado · Seguimiento',           resp:'Seguimiento y persistencia',   color:'var(--s2)', ct:'#000' },
  { id:3, nombre:'Pendiente · Se confirma con pago', resp:'Esperando el pago',            color:'var(--s3)', ct:'#fff' },
  { id:4, nombre:'Pagado · Derivar a Operaciones',   resp:'Pasar a Operaciones',          color:'var(--s4)', ct:'var(--yellow)' },
];
const COMERCIALES = ['César', 'Sandro', 'Valentín'];

/* ===== Almacenamiento: usa /api/ventas si existe (Railway), si no localStorage ===== */
const API = '/api/ventas';
const LS_KEY = 'baly_ventas_v1';
let useApi = false;
let leads = [];

const store = {
  async load(){
    try{
      const r = await fetch(API, {cache:'no-store'});
      if (r.ok && (r.headers.get('content-type')||'').includes('json')){ useApi = true; return await r.json(); }
    }catch(e){}
    useApi = false;
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
  },
  async save(lead){
    if (useApi){
      const r = await fetch(API + '/' + encodeURIComponent(lead.id), {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(lead)
      });
      if (!r.ok) throw new Error('No se pudo guardar en el servidor');
    } else this.persistLocal();
  },
  async remove(id){
    if (useApi){
      const r = await fetch(API + '/' + encodeURIComponent(id), {method:'DELETE'});
      if (!r.ok) throw new Error('No se pudo eliminar en el servidor');
    } else this.persistLocal();
  },
  persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(leads)); }catch(e){ alert('No se pudo guardar localmente'); } }
};

/* ===== Archivos: en el servidor (/api/archivos) o, sin servidor, en este navegador (IndexedDB) ===== */
const API_FILES = '/api/archivos';
const idb = {
  _db: null,
  open(){
    if (this._db) return this._db;
    return this._db = new Promise((res, rej) => {
      const r = indexedDB.open('baly_archivos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('archivos');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('archivos', mode); const st = t.objectStore('archivos');
      const req = fn(st); t.oncomplete = () => res(req?.result); t.onerror = () => rej(t.error);
    });
  },
  put(id, blob){ return this.tx('readwrite', st => st.put(blob, id)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); },
};
const files = {
  async subir(f){
    const meta = { id: uid(), nombre: f.name, tipo: f.type || '', tam: f.size, fecha: new Date().toISOString() };
    if (useApi){
      const r = await fetch(API_FILES, { method:'POST', body:f, headers:{
        'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) } });
      if (!r.ok) throw new Error(`No se pudo subir "${f.name}"`);
      const j = await r.json(); meta.id = j.id; meta.url = j.url || `${API_FILES}/${j.id}`;
    } else {
      await idb.put(meta.id, f);
    }
    return meta;
  },
  async borrar(meta){
    try{
      if (meta.url) await fetch(meta.url, { method:'DELETE' });
      else await idb.del(meta.id);
    }catch(e){}
  },
  async abrir(meta){
    if (meta.url){ window.open(meta.url, '_blank', 'noopener'); return; }
    const w = window.open('', '_blank');           // se abre ya para que el navegador no lo bloquee
    const blob = await idb.get(meta.id);
    if (!blob){ w && w.close(); alert('Este archivo no está guardado en este navegador.'); return; }
    const url = URL.createObjectURL(blob);
    const visible = /^(image\/|application\/pdf|text\/)/.test(blob.type);
    if (w && visible){ w.location = url; }
    else { w && w.close(); const a = document.createElement('a'); a.href = url; a.download = meta.nombre; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
};
const fmtTam = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB' : (b/1048576).toFixed(1).replace('.',',') + ' MB';

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtNum = n => Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2});
// Acepta "1,5" o "1.5"
function parseNum(v){ const n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isFinite(n) && n > 0 ? n : null; }
const fmtPlata = n => '$ ' + Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
// Acepta "1.250.000", "1250000", "1.250.000,50" o "1250000.5"
function parsePlata(v){
  let t = String(v||'').replace(/[^\d.,]/g,''); if (!t) return null;
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',','.');
  else if ((t.match(/\./g)||[]).length > 1 || /\.\d{3}$/.test(t)) t = t.replace(/\./g,'');
  const n = parseFloat(t); return isFinite(n) && n > 0 ? n : null;
}
const fmtFecha = iso => new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function hace(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d <= 0 ? 'hoy' : d === 1 ? 'hace 1 día' : `hace ${d} días`;
}
// Teléfono en formato internacional argentino de celular: 549 + característica + número (ej. 5491123829264)
function telAR(tel){
  let d = String(tel || '').replace(/\D/g,'');
  if (!d) return '';
  d = d.replace(/^00/,'');
  if (d.startsWith('54')) d = d.slice(2);
  d = d.replace(/^9/,'').replace(/^0/,'');
  return d ? '549' + d : '';
}
// CRM → panel de Rimnexo · WPP (o sin origen) → WhatsApp
function contactoLink(l){
  const n = telAR(l.telefono);
  if (!n) return null;
  return l.origen === 'CRM'
    ? { href: 'https://sdr.rimnexo.com/panel?phone=' + n, texto: 'Abrir en CRM', cls: 'crm' }
    : { href: 'https://wa.me/' + n, texto: 'WhatsApp', cls: '' };
}

/* ===== Render ===== */
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const fo = $('#fOrigen').value;
  const fl = $('#fLleva').value;
  const visibles = leads.filter(l =>
    (!fo || l.origen === fo) &&
    (!fl || l.lleva === fl) &&
    (!q || [l.cliente,l.ciudad,l.telefono,l.lleva].join(' ').toLowerCase().includes(q))
  );
  $('#board').innerHTML = ETAPAS.map(e => {
    const items = visibles.filter(l => l.etapa === e.id).sort((a,b) => b.actualizado.localeCompare(a.actualizado));
    const pallets = items.reduce((s,l) => s + Number(l.pallets||0), 0);
    const cotizado = items.reduce((s,l) => s + Number(l.cotizacion||0), 0);
    return `
    <section class="col" data-etapa="${e.id}" style="--c:${e.color};--ct:${e.ct}">
      <div class="col-head">
        <div class="col-title"><span>${e.id}) ${esc(e.nombre)}</span><span class="count">${items.length}</span></div>
        <div class="col-sub">${esc(e.resp)}</div>
        <div class="col-sum"><div class="stat"><small>Pallets</small><b>${fmtNum(pallets)}</b></div><div class="stat"><small>Monto</small><b>${fmtPlata(cotizado)}</b></div></div>
      </div>
      <div class="cards">
        ${items.length ? items.map(card).join('') : `<div class="empty"><img alt="" src="${$('#canImg').src}"><span>Sin ventas en esta etapa</span></div>`}
      </div>
    </section>`;
  }).join('');

  // Resumen del hero (respeta filtros y búsqueda)
  const enCurso = visibles.filter(l => l.etapa !== 4);
  const pagadas = visibles.filter(l => l.etapa === 4);
  const suma = (arr, k) => arr.reduce((s,l) => s + Number(l[k]||0), 0);
  $('#kVentas').textContent = enCurso.length;
  $('#kPallets').textContent = fmtNum(suma(enCurso,'pallets'));
  $('#kMonto').textContent = fmtPlata(suma(enCurso,'cotizacion'));
  $('#kPagado').textContent = fmtPlata(suma(pagadas,'cotizacion'));
  const hoy = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const quien = $('#fLleva').value;
  $('#heroSub').textContent = (quien ? `Vista de ${quien} · ` : '') + hoy.charAt(0).toUpperCase() + hoy.slice(1) +
    ` · ${pagadas.length} ${pagadas.length === 1 ? 'venta pagada' : 'ventas pagadas'}`;
}
function card(l){
  const nota = l.notas?.length ? l.notas[l.notas.length-1].texto : '';
  const contacto = contactoLink(l);
  const meta = [
    l.pallets ? `<span><b>${fmtNum(l.pallets)}</b> pallets</span>` : '',
    l.cotizacion ? `<span>💲 <b>${fmtPlata(l.cotizacion)}</b></span>` : '',
    l.ciudad ? `<span>📍 ${esc(l.ciudad)}</span>` : '',
    l.telefono ? `<span>📞 ${esc(l.telefono)}</span>` : '',
    l.archivos?.length ? `<span>📎 ${l.archivos.length}</span>` : '',
  ].join('');
  return `
  <article class="card" draggable="true" data-id="${l.id}">
    <div class="card-top"><div class="name">${l.cliente ? esc(l.cliente) : '<span style="color:var(--muted)">Sin nombre</span>'}</div><span style="display:flex;gap:4px">${l.origen ? `<span class="tag ${esc(l.origen)}">${esc(l.origen)}</span>` : ''}${l.lleva ? `<span class="who">${esc(l.lleva)}</span>` : ''}</span></div>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    ${nota ? `<div class="last-note">${esc(nota)}</div>` : ''}
    <div class="card-actions">
      <div style="display:flex;gap:4px">
        <button data-move="-1" ${l.etapa===1?'disabled':''} title="Etapa anterior">←</button>
        <button data-move="1" ${l.etapa===4?'disabled':''} title="Siguiente etapa">→</button>
      </div>
      ${contacto ? `<a class="wa ${contacto.cls}" href="${esc(contacto.href)}" target="_blank" rel="noopener">${contacto.texto}</a>` : ''}
      <span class="age">${hace(l.actualizado)}</span>
    </div>
  </article>`;
}

/* ===== Mover etapa ===== */
async function moverA(id, etapa){
  const l = leads.find(x => x.id === id);
  if (!l || etapa < 1 || etapa > 4 || l.etapa === etapa) return;
  const prev = l.etapa;
  l.etapa = etapa; l.actualizado = new Date().toISOString();
  l.notas = l.notas || [];
  l.notas.push({ texto:`Movido de "${ETAPAS[prev-1].nombre}" a "${ETAPAS[etapa-1].nombre}"`, fecha:l.actualizado, auto:true });
  render();
  try{ await store.save(l); }catch(e){ alert(e.message); }
}

const board = $('#board');
board.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (e.target.closest('a')) return;
  const mv = e.target.closest('[data-move]');
  if (mv){ const l = leads.find(x => x.id === c.dataset.id); moverA(l.id, l.etapa + Number(mv.dataset.move)); return; }
  abrir(c.dataset.id);
});
board.addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging');
});
board.addEventListener('dragend', e => e.target.closest('.card')?.classList.remove('dragging'));
board.addEventListener('dragover', e => {
  const col = e.target.closest('.col'); if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c => c.classList.toggle('drag-over', c === col));
});
board.addEventListener('dragleave', e => { if (!board.contains(e.relatedTarget)) document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-over')); });
board.addEventListener('drop', e => {
  const col = e.target.closest('.col'); if (!col) return;
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-over'));
  moverA(e.dataTransfer.getData('text/plain'), Number(col.dataset.etapa));
});

/* ===== Modal crear / editar ===== */
const dlg = $('#dlg'), form = $('#form');
let editId = null, draftId = null, notasTmp = [], archivosTmp = [], subidosEnSesion = [], guardado = false, subiendo = 0;
$('#selEtapa').innerHTML = ETAPAS.map(e => `<option value="${e.id}">${e.id}) ${esc(e.nombre)}</option>`).join('');
$('#selLleva').innerHTML = '<option value="">—</option>' + COMERCIALES.map(c => `<option>${esc(c)}</option>`).join('');
$('#fLleva').innerHTML += COMERCIALES.map(c => `<option>${esc(c)}</option>`).join('');

// Origen: tocar de nuevo la opción elegida la desmarca (queda vacío)
document.querySelectorAll('.seg input').forEach(r => {
  let estaba = false;
  r.parentElement.addEventListener('pointerdown', () => { estaba = r.checked; });
  r.addEventListener('click', () => { if (estaba){ r.checked = false; estaba = false; } });
});

function abrir(id){
  editId = id || null;
  draftId = editId || uid();
  guardado = false; subidosEnSesion = [];
  const l = id ? leads.find(x => x.id === id) : null;
  form.reset();
  $('#err').textContent = ''; $('#uploading').textContent = '';
  $('#dlgTitle').textContent = l ? 'Editar venta' : 'Nueva venta';
  $('#btnDelete').style.visibility = l ? 'visible' : 'hidden';
  if (l){
    form.cliente.value = l.cliente || ''; form.telefono.value = l.telefono || '';
    form.pallets.value = l.pallets ? fmtNum(l.pallets) : ''; form.ciudad.value = l.ciudad || '';
    form.cotizacion.value = l.cotizacion ? Number(l.cotizacion).toLocaleString('es-AR') : '';
    document.querySelectorAll('.seg input').forEach(r => r.checked = r.value === l.origen);
    form.etapa.value = l.etapa || 1;
    form.lleva.value = l.lleva || '';
  } else {
    form.etapa.value = 1;
    form.lleva.value = $('#fLleva').value; // si estás filtrando por un comercial, se precarga
  }
  notasTmp = l ? structuredClone(l.notas || []) : [];
  archivosTmp = l ? structuredClone(l.archivos || []) : [];
  pintarNotas(); pintarArchivos();
  dlg.showModal();
  if (!l) form.cliente.focus();
}

/* Notas */
function pintarNotas(){
  $('#notesList').innerHTML = notasTmp.length
    ? notasTmp.map((n,i) => `<div class="note"><small>${fmtFecha(n.fecha)}</small>${esc(n.texto)}<button type="button" class="x" data-i="${i}" title="Borrar nota">✕</button></div>`).reverse().join('')
    : '<div class="age">Todavía no hay notas</div>';
}
function agregarNota(){
  const t = $('#noteText').value.trim(); if (!t) return;
  notasTmp.push({ texto:t, fecha:new Date().toISOString() });
  $('#noteText').value = ''; pintarNotas();
}
$('#btnAddNote').onclick = agregarNota;
$('#noteText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); agregarNota(); } });
$('#notesList').addEventListener('click', e => {
  const x = e.target.closest('.x'); if (!x) return;
  if (confirm('¿Borrar esta nota?')){ notasTmp.splice(Number(x.dataset.i),1); pintarNotas(); }
});

/* Archivos */
function pintarArchivos(){
  $('#filesList').innerHTML = archivosTmp.map((f,i) => `
    <div class="file"><span>${icono(f)}</span><a data-i="${i}" title="Abrir">${esc(f.nombre)}</a><small>${fmtTam(f.tam||0)}</small><button type="button" class="x" data-i="${i}" title="Quitar archivo">✕</button></div>`).join('');
}
function icono(f){
  const n = (f.nombre||'').toLowerCase();
  if (/^image\//.test(f.tipo)) return '🖼️';
  if (n.endsWith('.pdf')) return '📄';
  if (/\.(xlsx?|csv|ods)$/.test(n)) return '📊';
  return '📎';
}
async function agregarArchivos(lista){
  const arr = [...lista]; if (!arr.length) return;
  const grandes = arr.filter(f => f.size > 25 * 1048576);
  if (grandes.length) alert('Estos archivos superan 25 MB y no se agregaron:\n' + grandes.map(f => f.name).join('\n'));
  for (const f of arr.filter(f => f.size <= 25 * 1048576)){
    subiendo++; $('#uploading').textContent = `Subiendo ${f.name}…`;
    try{
      const meta = await files.subir(f);
      archivosTmp.push(meta); subidosEnSesion.push(meta); pintarArchivos();
    }catch(err){ alert(err.message || `No se pudo agregar "${f.name}"`); }
    finally{ subiendo--; }
  }
  $('#uploading').textContent = '';
}
const drop = $('#drop');
drop.onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { agregarArchivos(e.target.files); e.target.value = ''; };
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); agregarArchivos(e.dataTransfer.files); });
$('#filesList').addEventListener('click', e => {
  const a = e.target.closest('a[data-i]'); if (a){ files.abrir(archivosTmp[Number(a.dataset.i)]); return; }
  const x = e.target.closest('.x'); if (!x) return;
  const f = archivosTmp[Number(x.dataset.i)];
  if (confirm(`¿Quitar "${f.nombre}"?`)){ archivosTmp.splice(Number(x.dataset.i),1); pintarArchivos(); }
});

/* Guardar / cancelar */
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (subiendo){ $('#err').textContent = 'Esperá a que terminen de subirse los archivos.'; return; }
  agregarNota(); // si quedó texto escrito sin agregar, se guarda igual
  const ahora = new Date().toISOString();
  const datos = {
    cliente: form.cliente.value.trim(), telefono: form.telefono.value.trim(),
    pallets: parseNum(form.pallets.value), cotizacion: parsePlata(form.cotizacion.value),
    ciudad: form.ciudad.value.trim(), origen: form.origen.value || '', lleva: form.lleva.value,
    etapa: Number(form.etapa.value) || 1, notas: notasTmp, archivos: archivosTmp, actualizado: ahora
  };
  let lead;
  if (editId){
    lead = leads.find(x => x.id === editId);
    // archivos que se quitaron: se borran del almacenamiento
    const quedan = new Set(archivosTmp.map(f => f.id));
    (lead.archivos || []).filter(f => !quedan.has(f.id)).forEach(f => files.borrar(f));
    Object.assign(lead, datos);
  } else { lead = { id: draftId, creado: ahora, ...datos }; leads.push(lead); }
  // archivos subidos en esta edición pero quitados antes de guardar
  const enVenta = new Set(archivosTmp.map(f => f.id));
  subidosEnSesion.filter(f => !enVenta.has(f.id)).forEach(f => files.borrar(f));
  guardado = true;
  dlg.close(); render();
  try{ await store.save(lead); }catch(err){ alert(err.message); }
});
// Si se cierra sin guardar, se descartan los archivos subidos en esta edición
dlg.addEventListener('close', () => {
  if (!guardado) subidosEnSesion.forEach(f => files.borrar(f));
  subidosEnSesion = [];
});
$('#btnDelete').onclick = async () => {
  const l = leads.find(x => x.id === editId);
  if (!l || !confirm(`¿Eliminar la venta${l.cliente ? ' de ' + l.cliente : ''}? No se puede deshacer.`)) return;
  leads = leads.filter(x => x.id !== editId);
  [...(l.archivos || []), ...subidosEnSesion].forEach(f => files.borrar(f));
  subidosEnSesion = [];
  dlg.close(); render();
  try{ await store.remove(l.id); }catch(err){ alert(err.message); }
};
$('#btnClose').onclick = $('#btnCancel').onclick = () => dlg.close();
$('#btnNew').onclick = () => abrir();

/* ===== Filtros ===== */
$('#q').addEventListener('input', render);
$('#fOrigen').addEventListener('change', render);
$('#fLleva').addEventListener('change', render);

/* ===== Vista horizontal / vertical (se recuerda en este navegador) ===== */
function setVista(v){
  board.classList.toggle('vertical', v === 'vertical');
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  try{ localStorage.setItem('baly_vista', v); }catch(e){}
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setVista(b.dataset.view));
let vistaInicial = 'horizontal';
try{ vistaInicial = localStorage.getItem('baly_vista') || (innerWidth < 700 ? 'vertical' : 'horizontal'); }catch(e){}
setVista(vistaInicial);

/* ===== Exportar / Importar respaldo (incluye los archivos adjuntos) ===== */
const aBase64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const deBase64 = (b64, tipo) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], { type: tipo || 'application/octet-stream' }); };

$('#btnExport').onclick = async () => {
  const btn = $('#btnExport'); btn.disabled = true; btn.textContent = 'Exportando…';
  try{
    const copia = structuredClone(leads);
    let faltan = 0;
    for (const l of copia){
      for (const a of (l.archivos || [])){
        try{
          const blob = a.url ? await (await fetch(a.url)).blob() : await idb.get(a.id);
          if (blob) a.datos = await aBase64(blob); else faltan++;
        }catch(e){ faltan++; }
      }
    }
    const out = new Blob([JSON.stringify(copia)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = `baly-ventas-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    if (faltan) alert(`${faltan} archivo(s) no se encontraron y no van en el respaldo.`);
  } finally { btn.disabled = false; btn.textContent = 'Exportar'; }
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  let data;
  try{ data = JSON.parse(await f.text()); if (!Array.isArray(data)) throw new Error(); }
  catch(err){ alert('El archivo no es un respaldo válido.'); return; }
  const nArch = data.reduce((s,l) => s + (l.archivos || []).filter(a => a.datos).length, 0);
  if (!confirm(`Se van a cargar ${data.length} ventas${nArch ? ` y ${nArch} archivos` : ''} (las que tengan el mismo ID se reemplazan). ¿Seguir?`)) return;
  const btn = $('#btnImport'); btn.disabled = true;
  let errores = 0;
  try{
    for (const [n, l] of data.entries()){
      btn.textContent = `Importando ${n + 1}/${data.length}…`;
      const archivos = [];
      for (const a of (l.archivos || [])){
        if (!a.datos){ archivos.push(a); continue; }
        try{
          const file = new File([deBase64(a.datos, a.tipo)], a.nombre || 'archivo', { type: a.tipo || '' });
          const meta = await files.subir(file);
          meta.fecha = a.fecha || meta.fecha;
          archivos.push(meta);
        }catch(err){ errores++; }
      }
      l.archivos = archivos;
      const i = leads.findIndex(x => x.id === l.id);
      if (i >= 0) leads[i] = l; else leads.push(l);
      try{ if (useApi) await store.save(l); }catch(err){ errores++; }
    }
    if (!useApi) store.persistLocal();
    render();
    alert(errores ? `Importado, pero hubo ${errores} error(es). Revisá las ventas.` : `Listo: se importaron ${data.length} ventas.`);
  } finally { btn.disabled = false; btn.textContent = 'Importar'; }
};

/* ===== Inicio ===== */
(async () => {
  leads = await store.load();
  $('#mode').textContent = useApi ? '● Compartido' : '● Solo este navegador';
  $('#mode').title = useApi ? 'Los datos se guardan en el servidor' : 'Sin servidor: los datos quedan en este navegador';
  render();
  // En modo servidor, refresca cada 20s para ver cambios de otros comerciales
  if (useApi) setInterval(async () => {
    if (dlg.open) return;
    try{ const r = await fetch(API, {cache:'no-store'}); if (r.ok){ leads = await r.json(); render(); } }catch(e){}
  }, 20000);
})();
</script>
