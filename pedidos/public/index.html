<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baly · Pedidos</title>
<meta name="description" content="Armá tu pedido de Baly Energy Drink y mandalo por WhatsApp.">
<meta name="theme-color" content="#FFCD00">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFCD00; --black:#0b0b0b; --ink:#111; --muted:#6b6b66; --bg:#f6f5f1; --card:#fff;
    --line:#e7e5de; --wpp:#25d366; --wpp-dark:#128c4a; --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:Montserrat,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:110px}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  img{display:block}

  /* Cabecera */
  .hero{background:var(--yellow);position:relative;overflow:hidden;padding:22px 16px 26px}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.22)}
  .hero-in{max-width:1100px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:18px;justify-content:space-between}
  .hero .logo{height:46px;width:auto}
  .hero h1{margin:14px 0 4px;font-size:clamp(26px,6vw,40px);font-weight:900;letter-spacing:-.02em;line-height:1.02}
  .hero p{margin:0;font-weight:600;font-size:14px;max-width:420px;opacity:.85}
  .hero-cans{display:flex;align-items:flex-end;gap:0;flex-shrink:0}
  .hero-cans img{height:120px;width:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));margin-left:-18px}
  .hero-cans img:nth-child(2){height:140px;z-index:2}
  @media (max-width:560px){.hero-cans{display:none}}

  /* Filtros */
  .filtros{position:sticky;top:0;z-index:20;background:rgba(246,245,241,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .filtros-in{max-width:1100px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .filtros-in::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:9px 15px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;transition:.15s}
  .chip.on{background:var(--black);border-color:var(--black);color:#fff}
  .chip .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--yellow);color:#000;font-size:11px;line-height:18px;text-align:center}

  main{max-width:1100px;margin:0 auto;padding:6px 16px 20px}
  .grupo{margin-top:22px}
  .grupo h2{margin:0 0 12px;font-size:18px;font-weight:900;display:flex;align-items:baseline;gap:10px}
  .grupo h2 small{font-size:12px;font-weight:600;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (min-width:1080px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

  /* Tarjeta de producto */
  .card{background:var(--card);border-radius:var(--radius);border:1.5px solid transparent;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s, transform .15s, box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.sel{border-color:var(--black);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .foto{position:relative;height:190px;display:flex;align-items:flex-end;justify-content:center;padding-top:14px;background:#fff;cursor:pointer}
  .foto::before{content:"";position:absolute;left:50%;bottom:16px;width:72%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--tint);opacity:.22}
  .foto img{position:relative;height:166px;width:auto;max-width:86%;object-fit:contain;mix-blend-mode:multiply;transition:transform .2s}
  .foto.botella img{height:176px}
  .foto:active img{transform:scale(.96)}
  .badge{position:absolute;top:10px;left:10px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:4px 8px;border-radius:7px;background:var(--black);color:#fff}
  .badge.sa{background:#fff;color:var(--black);border:1.5px solid var(--black)}
  .cant-pill{position:absolute;top:10px;right:10px;z-index:2;background:var(--yellow);color:#000;font-weight:900;font-size:13px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .card.sel .cant-pill{display:flex}
  .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .nombre{font-weight:800;font-size:14.5px;line-height:1.2;min-height:35px}
  .nombre span{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
  .stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:4px;margin-top:auto}
  .stepper button{width:40px;height:40px;border-radius:11px;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .stepper button.mas{background:var(--black);color:#fff}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper input{width:52px;text-align:center;border:0;background:transparent;font:inherit;font-weight:900;font-size:18px;-moz-appearance:textfield;padding:0}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper .u{display:block;font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin-top:-3px}
  .rapidos{display:flex;gap:6px}
  .rapidos button{flex:1;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);font-weight:800;font-size:12px;background:#fff}
  .rapidos button:active{background:var(--yellow);border-color:var(--yellow)}

  /* Barra inferior */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
  .barra.on{background:linear-gradient(to top,var(--bg) 60%,rgba(246,245,241,0))}
  .barra-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--black);color:#fff;border-radius:22px;padding:10px 10px 10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:auto;transform:translateY(140%);transition:transform .25s}
  .barra.on .barra-in{transform:none}
  .barra .tot{flex:1;line-height:1.15}
  .barra .tot b{font-size:20px;font-weight:900;color:var(--yellow)}
  .barra .tot small{display:block;font-size:12px;opacity:.75;font-weight:600}
  .btn-ver{background:var(--yellow);color:#000;font-weight:900;padding:14px 18px;border-radius:15px;font-size:15px}

  /* Hoja del pedido */
  .velo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
  .velo.on{opacity:1;pointer-events:auto}
  .hoja{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;visibility:hidden;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .hoja.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .hoja-top{padding:10px 18px 6px;display:flex;align-items:center;justify-content:space-between}
  .hoja-top::before{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;border-radius:3px;background:#ddd;transform:translateX(-50%)}
  .hoja-top h3{margin:14px 0 0;font-size:21px;font-weight:900}
  .cerrar{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:20px;font-weight:700;margin-top:10px}
  .hoja-cuerpo{overflow-y:auto;padding:4px 18px 16px}
  .linea{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .linea img{width:38px;height:56px;object-fit:contain;mix-blend-mode:multiply;flex-shrink:0}
  .linea .ln{flex:1;font-weight:800;font-size:14px;line-height:1.2}
  .linea .ln span{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .linea .stepper{margin:0;padding:3px;gap:2px}
  .linea .stepper button{width:32px;height:32px;font-size:18px}
  .linea .stepper input{width:42px;font-size:16px}
  .resumen{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-weight:800}
  .resumen b{font-size:20px;font-weight:900}
  .campos{display:grid;gap:10px;margin-top:14px}
  .campos label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}
  .campos input,.campos textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font:inherit;font-weight:600;font-size:16px;background:#fff;color:var(--ink);outline:none}
  .campos input:focus,.campos textarea:focus{border-color:var(--black)}
  .campos textarea{min-height:70px;resize:vertical}
  .campos .err{border-color:#c10b20}
  .hoja-pie{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
  .btn-wpp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--wpp);color:#fff;font-weight:900;font-size:16px;padding:16px;border-radius:16px}
  .btn-wpp:active{background:var(--wpp-dark)}
  .btn-wpp svg{width:22px;height:22px}
  .btn-vaciar{font-weight:700;font-size:13px;color:var(--muted);padding:6px}
  .vacio{text-align:center;padding:30px 0;color:var(--muted);font-weight:600}

  .toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--black);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{max-width:1100px;margin:30px auto 0;padding:0 16px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div>
      <img class="logo" src="img/logo.png" alt="Baly Energy Drink">
      <h1>Armá tu pedido</h1>
      <p>Elegí los sabores y la cantidad de packs. Al final lo mandás por WhatsApp y te confirmamos.</p>
    </div>
    <div class="hero-cans" aria-hidden="true">
      <img src="img/hero-473-mango.webp" alt="">
      <img src="img/hero-473-tradicional.webp" alt="">
      <img src="img/hero-473-sandia.webp" alt="">
    </div>
  </div>
</header>

<nav class="filtros" aria-label="Filtrar productos"><div class="filtros-in" id="filtros"></div></nav>

<main id="catalogo"></main>

<footer>Baly Argentina · Los pedidos se confirman por WhatsApp.</footer>

<div class="barra" id="barra">
  <div class="barra-in">
    <div class="tot"><b id="barraPacks">0</b> <span id="barraPacksTxt">packs</span><small id="barraSabores">0 sabores</small></div>
    <button class="btn-ver" id="btnVer">Ver pedido →</button>
  </div>
</div>

<div class="velo" id="velo"></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
  <div class="hoja-top">
    <h3 id="hojaTitulo">Tu pedido</h3>
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="hoja-cuerpo">
    <div id="lineas"></div>
    <div class="resumen" id="resumen"></div>
    <div class="campos">
      <div><label for="fNombre">Tu nombre o distribuidora *</label><input id="fNombre" autocomplete="organization" placeholder="Ej: Distribuidora San Martín"></div>
      <div><label for="fLocalidad">Localidad</label><input id="fLocalidad" autocomplete="address-level2" placeholder="Ej: Rosario"></div>
      <div><label for="fNota">Comentario</label><textarea id="fNota" placeholder="Algo que tengamos que saber (entrega, horario…)"></textarea></div>
    </div>
  </div>
  <div class="hoja-pie">
    <button class="btn-wpp" id="btnEnviar">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.3c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.3 8.3 0 1 1 12 20.3z"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <button class="btn-vaciar" id="btnVaciar">Vaciar pedido</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const WPP = '5491156662931';

// Catálogo: grupo, nombre, detalle, imagen, color de fondo
const GRUPOS = [
  { id:'473', titulo:'Latas 473 ml', sub:'La clásica' },
  { id:'250', titulo:'Latas 250 ml', sub:'Con azúcar' },
  { id:'250sa', titulo:'Latas 250 ml sin azúcar', sub:'Zero azúcar' },
  { id:'pro', titulo:'PRO · Con proteína', sub:'250 ml · 15 g de proteína' },
  { id:'2l', titulo:'Botellas 2 L', sub:'Única en Argentina' },
];
const P = [
  { id:'473-tradicional', g:'473', n:'Tradicional', f:'473 ml', c:'#1b1b1b' },
  { id:'473-sandia', g:'473', n:'Sandía', f:'473 ml', c:'#e5243b' },
  { id:'473-anana-menta', g:'473', n:'Ananá y Menta', f:'473 ml', c:'#1f9e8f' },
  { id:'473-frutilla-durazno', g:'473', n:'Frutilla y Durazno', f:'473 ml', c:'#f26a2b' },
  { id:'473-mango', g:'473', n:'Mango', f:'473 ml', c:'#1eaee0' },
  { id:'473-manzana-verde', g:'473', n:'Manzana Verde', f:'473 ml', c:'#3fbf3a' },
  { id:'473-frutas-tropicales', g:'473', n:'Frutas Tropicales', f:'473 ml', c:'#f2d41b' },

  { id:'250-tradicional', g:'250', n:'Tradicional', f:'250 ml', c:'#1b1b1b' },
  { id:'250-frutilla-durazno', g:'250', n:'Frutilla y Durazno', f:'250 ml', c:'#f26a2b' },
  { id:'250-manzana-verde', g:'250', n:'Manzana Verde', f:'250 ml', c:'#3fbf3a' },
  { id:'250-caipirinha', g:'250', n:'Caipirinha', f:'250 ml · sin alcohol', c:'#8bbf3a' },

  { id:'250-tradicional-sa', g:'250sa', n:'Tradicional', f:'250 ml · sin azúcar', c:'#f2c81b', sa:true },
  { id:'250-cereza-sa', g:'250sa', n:'Cereza', f:'250 ml · sin azúcar', c:'#e5243b', sa:true },
  { id:'250-mora-menta-sa', g:'250sa', n:'Mora y Menta', f:'250 ml · sin azúcar', c:'#9b7fd1', sa:true },
  { id:'250-frutilla-durazno-sa', g:'250sa', n:'Frutilla y Durazno', f:'250 ml · sin azúcar', c:'#f26a2b', sa:true },

  { id:'250-pro-tropical', g:'pro', n:'PRO Frutas Tropicales', f:'250 ml · Muscle Protein', c:'#f2c81b', sa:true },
  { id:'250-pro-banana', g:'pro', n:'PRO Banana', f:'250 ml · proteína', c:'#f2c81b', sa:true },
  { id:'250-pro-frutilla-durazno', g:'pro', n:'PRO Frutilla y Durazno', f:'250 ml · proteína', c:'#f26a2b', sa:true },

  { id:'2l-tradicional', g:'2l', n:'Tradicional', f:'Botella 2 L', c:'#1b1b1b', bot:true },
  { id:'2l-sandia', g:'2l', n:'Sandía', f:'Botella 2 L', c:'#e5243b', bot:true },
  { id:'2l-frutilla-durazno', g:'2l', n:'Frutilla y Durazno', f:'Botella 2 L', c:'#f26a2b', bot:true },
  { id:'2l-manzana-verde', g:'2l', n:'Manzana Verde', f:'Botella 2 L', c:'#3fbf3a', bot:true },
  { id:'2l-frutas-tropicales', g:'2l', n:'Frutas Tropicales', f:'Botella 2 L', c:'#f2d41b', bot:true },
];
const porId = Object.fromEntries(P.map(p => [p.id, p]));

// Estado (se recuerda en este celular por comodidad)
const LS = 'baly_pedido_v1';
const leer = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } };
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(est)); } catch(e){} };
const est = Object.assign({ cant:{}, nombre:'', localidad:'', nota:'' }, leer());
for (const k of Object.keys(est.cant)) if (!porId[k] || !(est.cant[k] > 0)) delete est.cant[k];
let filtro = 'todos';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const totalPacks = () => Object.values(est.cant).reduce((a,b) => a + b, 0);
const nSabores = () => Object.keys(est.cant).length;

function setCant(id, v){
  v = Math.max(0, Math.min(9999, Math.floor(Number(v) || 0)));
  if (v) est.cant[id] = v; else delete est.cant[id];
  guardar(); pintarCard(id); pintarBarra(); pintarFiltros();
  if ($('#hoja').classList.contains('on')) pintarHoja();
}

function stepperHTML(id, chico){
  const v = est.cant[id] || 0;
  return `<div class="stepper">
    <button class="menos" data-a="menos" data-id="${id}" aria-label="Restar un pack" ${v ? '' : 'disabled'}>−</button>
    <div><input type="number" inputmode="numeric" min="0" value="${v}" data-a="input" data-id="${id}" aria-label="Packs">${chico ? '' : '<span class="u">packs</span>'}</div>
    <button class="mas" data-a="mas" data-id="${id}" aria-label="Sumar un pack">+</button>
  </div>`;
}

function cardHTML(p){
  const v = est.cant[p.id] || 0;
  return `<article class="card ${v ? 'sel' : ''}" id="c-${p.id}" style="--tint:${p.c}">
    <div class="foto ${p.bot ? 'botella' : ''}" data-a="mas" data-id="${p.id}" title="Tocá para sumar un pack">
      ${p.sa ? '<span class="badge sa">SIN AZÚCAR</span>' : (p.g === '473' ? '<span class="badge">473</span>' : p.g === '2l' ? '<span class="badge">2 L</span>' : '<span class="badge">250</span>')}
      <span class="cant-pill">${v}</span>
      <img src="img/${p.id}.webp" alt="Baly ${esc(p.n)} ${esc(p.f)}" loading="lazy" width="216" height="560">
    </div>
    <div class="info">
      <div class="nombre">${esc(p.n)}<span>${esc(p.f)}</span></div>
      <div class="rapidos">
        <button data-a="sumar" data-n="5" data-id="${p.id}">+5</button>
        <button data-a="sumar" data-n="10" data-id="${p.id}">+10</button>
        <button data-a="sumar" data-n="20" data-id="${p.id}">+20</button>
      </div>
      ${stepperHTML(p.id)}
    </div>
  </article>`;
}

function pintarCatalogo(){
  const grupos = filtro === 'todos' ? GRUPOS : GRUPOS.filter(g => g.id === filtro);
  $('#catalogo').innerHTML = grupos.map(g => {
    const ps = P.filter(p => p.g === g.id);
    return `<section class="grupo"><h2>${esc(g.titulo)} <small>${esc(g.sub)}</small></h2>
      <div class="grid">${ps.map(cardHTML).join('')}</div></section>`;
  }).join('');
}

function pintarCard(id){
  const el = document.getElementById('c-' + id); if (!el) return;
  const v = est.cant[id] || 0;
  el.classList.toggle('sel', v > 0);
  el.querySelector('.cant-pill').textContent = v;
  const inp = el.querySelector('input'); if (document.activeElement !== inp) inp.value = v;
  el.querySelector('.menos').disabled = !v;
}

function pintarFiltros(){
  const cuenta = g => P.filter(p => p.g === g && est.cant[p.id]).length;
  const chips = [{ id:'todos', t:'Todos', n: nSabores() }].concat(GRUPOS.map(g => ({ id:g.id, t:g.titulo.replace(' · Con proteína',''), n:cuenta(g.id) })));
  $('#filtros').innerHTML = chips.map(c => `<button class="chip ${filtro === c.id ? 'on' : ''}" data-f="${c.id}">${esc(c.t)}${c.n ? `<span class="n">${c.n}</span>` : ''}</button>`).join('');
}

function pintarBarra(){
  const t = totalPacks(), s = nSabores();
  $('#barraPacks').textContent = t;
  $('#barraPacksTxt').textContent = t === 1 ? 'pack' : 'packs';
  $('#barraSabores').textContent = s + (s === 1 ? ' producto' : ' productos');
  $('#barra').classList.toggle('on', t > 0);
}

function pintarHoja(){
  const ids = P.map(p => p.id).filter(id => est.cant[id]);
  $('#lineas').innerHTML = ids.length ? ids.map(id => { const p = porId[id]; return `
    <div class="linea">
      <img src="img/${p.id}.webp" alt="">
      <div class="ln">${esc(p.n)}<span>${esc(p.f)}</span></div>
      ${stepperHTML(id, true)}
    </div>`; }).join('') : '<div class="vacio">Todavía no agregaste productos.</div>';
  const t = totalPacks();
  $('#resumen').innerHTML = ids.length ? `<span>Total</span><b>${t} ${t === 1 ? 'pack' : 'packs'}</b>` : '';
  $('#btnEnviar').disabled = !ids.length;
  $('#btnEnviar').style.opacity = ids.length ? 1 : .5;
}

function abrir(){ pintarHoja(); $('#fNombre').value = est.nombre; $('#fLocalidad').value = est.localidad; $('#fNota').value = est.nota;
  $('#hoja').classList.add('on'); $('#velo').classList.add('on'); document.body.style.overflow = 'hidden'; }
function cerrar(){ $('#hoja').classList.remove('on'); $('#velo').classList.remove('on'); document.body.style.overflow = ''; }

function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }

function mensaje(){
  const lineas = ['*Pedido Baly*', `Cliente: ${est.nombre.trim()}`];
  if (est.localidad.trim()) lineas.push(`Localidad: ${est.localidad.trim()}`);
  for (const g of GRUPOS){
    const ps = P.filter(p => p.g === g.id && est.cant[p.id]);
    if (!ps.length) continue;
    lineas.push('', `*${g.titulo}*`);
    for (const p of ps) lineas.push(`• ${est.cant[p.id]} ${est.cant[p.id] === 1 ? 'pack' : 'packs'} · ${p.n}`);
  }
  const t = totalPacks();
  lineas.push('', `*Total: ${t} ${t === 1 ? 'pack' : 'packs'}*`);
  if (est.nota.trim()) lineas.push('', `Comentario: ${est.nota.trim()}`);
  return lineas.join('\n');
}

function enviar(){
  if (!totalPacks()) return;
  if (!est.nombre.trim()){ $('#fNombre').classList.add('err'); $('#fNombre').focus(); toast('Poné tu nombre o el de la distribuidora'); return; }
  const url = `https://wa.me/${WPP}?text=${encodeURIComponent(mensaje())}`;
  window.open(url, '_blank', 'noopener');
  toast('¡Listo! Mandá el mensaje en WhatsApp para confirmar');
}

// Eventos
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]');
  if (f){ filtro = f.dataset.f; pintarFiltros(); pintarCatalogo(); window.scrollTo({ top: $('.filtros').offsetTop, behavior:'smooth' }); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = b.dataset.id, v = est.cant[id] || 0;
  if (b.dataset.a === 'mas') setCant(id, v + 1);
  else if (b.dataset.a === 'menos') setCant(id, v - 1);
  else if (b.dataset.a === 'sumar') setCant(id, v + Number(b.dataset.n));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.a === 'input') setCant(t.dataset.id, t.value);
  if (t.id === 'fNombre'){ est.nombre = t.value; t.classList.remove('err'); guardar(); }
  if (t.id === 'fLocalidad'){ est.localidad = t.value; guardar(); }
  if (t.id === 'fNota'){ est.nota = t.value; guardar(); }
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.a === 'input') e.target.select(); });
$('#btnVer').onclick = abrir;
$('#cerrar').onclick = cerrar;
$('#velo').onclick = cerrar;
$('#btnEnviar').onclick = enviar;
$('#btnVaciar').onclick = () => { if (!totalPacks()) return; est.cant = {}; guardar(); pintarCatalogo(); pintarBarra(); pintarFiltros(); pintarHoja(); toast('Pedido vacío'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

pintarFiltros(); pintarCatalogo(); pintarBarra();
</script>
</body>
</html>
